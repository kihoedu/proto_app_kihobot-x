<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>[박기호논술] 매트릭스 첨삭 시스템</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f3;--s:#fff;--s2:#f1f0ec;--bd:#e2e0d9;--tx:#1a1a18;--mt:#6b6b66;
  --pu:#534AB7;--pl:#EEEDFE;--pd:#3C3489;--te:#0F6E56;--tl:#E1F5EE;
  --am:#854F0B;--al:#FAEEDA;--co:#993C1D;--gn:#3B6D11;--gl:#EAF3DE;
  --re:#A32D2D;--r:10px;
}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.6}
header{background:var(--s);border-bottom:1px solid var(--bd);padding:0 20px;display:flex;align-items:center;height:52px;gap:10px;position:sticky;top:0;z-index:100}
header h1{font-size:15px;font-weight:600}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;background:var(--pl);color:var(--pd)}
nav{display:flex;gap:2px;margin-left:auto}
nav button{border:none;background:none;cursor:pointer;padding:5px 12px;border-radius:6px;font-size:13px;color:var(--mt);font-weight:500}
nav button.active,nav button:hover{background:var(--pl);color:var(--pd)}
main{max-width:1200px;margin:0 auto;padding:20px 14px}
.page{display:none}.page.active{display:block}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-pu{background:var(--pu);color:#fff}.btn-te{background:var(--te);color:#fff}
.btn-gh{background:var(--s2);color:var(--tx);border:1px solid var(--bd)}
.btn-sm{padding:5px 11px;font-size:12px}.btn-full{width:100%;justify-content:center;margin-top:14px}
.btn-rd{background:var(--re);color:#fff}
.card{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);padding:18px}
.card+.card{margin-top:12px}
.ct{font-size:11px;font-weight:600;color:var(--mt);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.fr{margin-bottom:10px}.fr label{display:block;font-size:12px;font-weight:500;margin-bottom:4px;color:var(--mt)}
.fr input,.fr textarea,.fr select{width:100%;border:1px solid var(--bd);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;outline:none;background:var(--s)}
.fr input:focus,.fr textarea:focus,.fr select:focus{border-color:var(--pu)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dz{border:2px dashed var(--bd);border-radius:var(--r);padding:32px 16px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
.dz:hover,.dz.over{border-color:var(--pu);background:var(--pl)}
.sb{background:var(--al);border:1px solid #EF9F27;border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sp{width:15px;height:15px;border:2px solid var(--bd);border-top-color:var(--pu);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
textarea{width:100%;border:1px solid var(--bd);border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical;outline:none;line-height:1.7}
textarea:focus{border-color:var(--pu)}
.tw{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.tw table{width:100%;border-collapse:collapse}
.tw th{font-size:11px;font-weight:600;color:var(--mt);text-align:left;padding:9px 13px;background:var(--s2);border-bottom:1px solid var(--bd)}
.tw td{padding:10px 13px;font-size:13px;border-bottom:1px solid var(--bd)}
.tw tr:last-child td{border-bottom:none}
.tw tr:hover td{background:var(--pl);cursor:pointer}
.em{text-align:center;padding:40px;color:var(--mt);font-size:13px}

/* 이미지 그룹핑 UI */
.img-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.img-thumb{position:relative;width:90px;height:110px;border:2px solid var(--bd);border-radius:7px;overflow:hidden;cursor:grab;background:var(--s2);flex-shrink:0}
.img-thumb img{width:100%;height:80px;object-fit:cover;display:block}
.img-thumb .img-label{font-size:10px;text-align:center;padding:3px;color:var(--mt);background:var(--s2)}
.img-thumb.dragging{opacity:.5;border-color:var(--pu)}
.img-thumb.selected{border-color:var(--pu);border-width:2px}
.item-group{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.item-group-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.item-badge{background:var(--pu);color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;flex-shrink:0}
.item-drop-zone{min-height:60px;border:2px dashed var(--bd);border-radius:6px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;transition:border-color .2s,background .2s}
.item-drop-zone.drag-over{border-color:var(--pu);background:var(--pl)}

/* 첨삭 리포트 */
.report-wrap{max-width:860px;margin:0 auto}
.report-section{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.report-section-header{background:var(--s2);padding:10px 16px;font-size:13px;font-weight:600;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.report-section-body{padding:16px}
.annotation-tag{display:inline-block;background:var(--pl);color:var(--pd);font-size:12px;font-weight:600;padding:2px 9px;border-radius:5px;margin-bottom:8px}
.annotation-text{font-size:13px;line-height:1.8;white-space:pre-wrap;color:var(--tx)}
.improvement-section{font-size:13px;line-height:1.9;color:var(--tx)}
.numbered-text{font-size:13px;line-height:1.9;white-space:pre-wrap;background:var(--s2);padding:14px;border-radius:7px;color:var(--tx)}
.score-badge{font-size:22px;font-weight:700;color:var(--pu)}
.edit-mode textarea{min-height:120px}
.item-tab-bar{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.item-tab{border:1px solid var(--bd);background:var(--s2);color:var(--mt);font-size:13px;font-weight:500;padding:6px 16px;border-radius:7px;cursor:pointer}
.item-tab.active{background:var(--pu);color:#fff;border-color:var(--pu)}
.item-tab.done{background:var(--gl);color:var(--gn);border-color:var(--gn)}

/* 프롬프트/문제 관리 */
.ptab{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--bd);padding-bottom:8px}
.ptab button{border:none;background:none;cursor:pointer;padding:5px 12px;border-radius:6px;font-size:12px;color:var(--mt);font-weight:500}
.ptab button.active{background:var(--pl);color:var(--pd)}
.pbox{background:var(--s2);border-radius:7px;padding:12px;font-size:13px;line-height:1.7;white-space:pre-wrap;max-height:240px;overflow-y:auto}

@media(max-width:760px){.fg{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>[박기호논술] 매트릭스 첨삭 시스템</h1><span class="pill">v4</span>
  <nav>
    <button class="active" onclick="nav('submit',this)">답안 제출</button>
    <button onclick="nav('reports',this)">평가 목록</button>
    <button onclick="nav('prompts',this)">프롬프트</button>
    <button onclick="nav('groups',this)">그룹 관리</button>
    <button onclick="nav('problems',this)">문제 관리</button>
    <button onclick="nav('students',this)">학생 관리</button>
    <button onclick="nav('settings',this)">설정</button>
  </nav>
</header>
<main>

<!-- ① 답안 제출 & 평가 결과 -->
<div id="page-submit" class="page active">
  <div style="display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start">

    <!-- 제출 폼 -->
    <div>
      <div class="card">
        <div class="ct">답안 제출</div>
        <div class="fg">
          <div class="fr"><label>학생 ID *</label><input id="sid" placeholder="student_001"></div>
          <div class="fr"><label>학생 이름</label><input id="snm" placeholder="홍길동"></div>
        </div>
        <div class="fr"><label>학원명</label><input id="acad" placeholder="박기호 논술학원"></div>
        <!-- 문제 분류 선택 -->
        <div class="fr">
          <label>문제 유형</label>
          <div style="display:flex;gap:6px">
            <button class="prob-type-btn active" id="btn-reg" onclick="setProbType('reg',this)" style="flex:1;padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--pl);color:var(--pd);font-size:12px;font-weight:600;cursor:pointer">정규반 교재</button>
            <button class="prob-type-btn" id="btn-univ" onclick="setProbType('univ',this)" style="flex:1;padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--s2);color:var(--mt);font-size:12px;font-weight:500;cursor:pointer">대학별 기출</button>
          </div>
        </div>

        <!-- 정규반 선택 -->
        <div id="sel-reg">
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
            <div class="fr" style="margin-bottom:6px">
              <label>권</label>
              <select id="reg-vol" onchange="updateRegSel()">
                <option value="">권 선택</option>
                <option value="1">1권</option>
                <option value="2">2권</option>
                <option value="3">3권</option>
                <option value="4">4권</option>
              </select>
            </div>
            <div class="fr" style="margin-bottom:6px">
              <label>강</label>
              <select id="reg-lec" onchange="updateRegSel()" disabled>
                <option value="">강 선택</option>
              </select>
            </div>
            <div class="fr" style="margin-bottom:6px">
              <label>번호</label>
              <select id="reg-num" onchange="selectProblem(this.value)" disabled>
                <option value="">번호 선택</option>
              </select>
            </div>
          </div>
          <div id="reg-preview" style="display:none"></div>
        </div>

        <!-- 대학별 선택 -->
        <div id="sel-univ" style="display:none">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
            <div class="fr" style="margin-bottom:6px">
              <label>대학교</label>
              <select id="univ-school" onchange="updateUnivSel()">
                <option value="">대학 선택</option>
              </select>
            </div>
            <div class="fr" style="margin-bottom:6px">
              <label>학년도</label>
              <select id="univ-year" onchange="updateUnivSel2()" disabled>
                <option value="">연도 선택</option>
              </select>
            </div>
            <div class="fr" style="margin-bottom:6px">
              <label>구분</label>
              <select id="univ-type" onchange="updateUnivSel3()" disabled>
                <option value="">구분 선택</option>
                <option value="기출">기출</option>
                <option value="모의">모의</option>
              </select>
            </div>
            <div class="fr" style="margin-bottom:6px">
              <label>문항번호</label>
              <select id="univ-num" onchange="selectProblem(this.value)" disabled>
                <option value="">번호 선택</option>
              </select>
            </div>
          </div>
          <div id="univ-preview" style="display:none"></div>
        </div>

        <input type="hidden" id="prob-sel" value="">

        <!-- 이미지 업로드 -->
        <div class="fr" style="margin-top:4px">
          <label>원고지 이미지 업로드</label>
          <div class="dz" id="dz" onclick="document.getElementById('fi').click()">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--mt)" stroke-width="1.5"><path d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/></svg>
            <p style="font-size:12px;color:var(--mt);margin-top:6px"><strong style="color:var(--tx)">클릭 또는 드래그</strong></p>
            <p style="font-size:11px;color:var(--mt)">원고지 이미지 여러 장 한꺼번에</p>
          </div>
          <input type="file" id="fi" accept="image/*,.pdf" multiple style="display:none" onchange="handleFiles(this.files)">
        </div>

        <!-- 자동 분석 결과 -->
        <div id="auto-analysis" style="display:none;margin-top:8px"></div>

        <!-- 수동 그룹핑 (자동 분석 실패 시 폴백) -->
        <div id="manual-area" style="display:none;margin-top:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <div style="font-size:12px;color:var(--mt)">수동 문항 배정</div>
            <button class="btn btn-gh btn-sm" onclick="addItemGroup()">+ 문항 추가</button>
          </div>
          <div id="item-groups"></div>
          <div id="thumb-area" style="margin-top:8px">
            <div style="font-size:11px;color:var(--mt);margin-bottom:4px">이미지를 문항 영역으로 드래그</div>
            <div class="img-grid" id="thumb-grid"></div>
          </div>
        </div>

        <button class="btn btn-pu btn-full" id="submit-btn" onclick="submitEssay()" style="display:none">첨삭 시작</button>
      </div>
    </div>

    <!-- 결과 영역 -->
    <div>
      <div id="status-area" style="display:none">
        <div class="sb"><div class="sp" id="sp"></div><span id="st">처리 중...</span></div>
      </div>
      <div id="result-area"></div>
    </div>
  </div>
</div>

<!-- ② 평가 목록 -->
<div id="page-reports" class="page">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h2 style="font-size:16px;font-weight:600">평가 목록</h2>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <input id="f-sid" placeholder="학생 ID" style="border:1px solid var(--bd);border-radius:6px;padding:5px 9px;font-size:12px;width:120px">
      <select id="f-st" style="border:1px solid var(--bd);border-radius:6px;padding:5px 9px;font-size:12px">
        <option value="">전체</option><option value="done">완료</option>
        <option value="teacher_reviewed">교사 검토 완료</option>
      </select>
      <button class="btn btn-gh btn-sm" onclick="loadReports()">검색</button>
      <button class="btn btn-pu btn-sm" onclick="downloadBatchPDF()">선택 PDF 출력</button>
    </div>
  </div>
  <div class="tw" id="rep-tbl"><div class="em">불러오는 중...</div></div>
</div>

<!-- ③ 그룹 관리 -->
<div id="page-groups" class="page">
  <div style="display:grid;grid-template-columns:380px 1fr;gap:16px">
    <div class="card">
      <div class="ct" id="gf-title">문제 그룹 등록</div>
      <div class="fr">
        <label>유형</label>
        <div style="display:flex;gap:6px">
          <button class="grp-type-btn active" id="gbtn-reg" onclick="setGrpType('reg',this)" style="flex:1;padding:7px;border:1px solid var(--pu);border-radius:6px;background:var(--pl);color:var(--pd);font-size:12px;font-weight:600;cursor:pointer">정규반</button>
          <button class="grp-type-btn" id="gbtn-univ" onclick="setGrpType('univ',this)" style="flex:1;padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--s2);color:var(--mt);font-size:12px;font-weight:500;cursor:pointer">대학별</button>
        </div>
      </div>
      <div class="fr"><label>그룹 ID *</label><input id="g-id" placeholder="reg_1_05 또는 univ_korea_2025"></div>
      <div class="fr"><label>그룹 제목 *</label><input id="g-title" placeholder="1권 5강 또는 고려대 2025학년도 기출"></div>

      <!-- 정규반 -->
      <div id="gf-reg">
        <div class="fg">
          <div class="fr"><label>권</label>
            <select id="g-vol">
              <option value="">선택</option>
              <option value="1">1권</option><option value="2">2권</option>
              <option value="3">3권</option><option value="4">4권</option>
            </select>
          </div>
          <div class="fr"><label>강</label>
            <select id="g-lec">
              <option value="">선택</option>
              <script>for(var i=1;i<=8;i++)document.write('<option value="'+i+'">'+i+'강</option>')</script>
            </select>
          </div>
        </div>
      </div>

      <!-- 대학별 -->
      <div id="gf-univ" style="display:none">
        <div class="fg">
          <div class="fr"><label>대학교</label><input id="g-univ" placeholder="고려대"></div>
          <div class="fr"><label>학년도</label><input id="g-year" placeholder="2025"></div>
          <div class="fr"><label>구분</label>
            <select id="g-etype">
              <option value="">선택</option>
              <option value="기출">기출</option><option value="모의">모의</option>
            </select>
          </div>
        </div>
      </div>

      <div class="fr">
        <label>포함 문제 (문항 순서대로 선택)</label>
        <div id="g-prob-list" style="display:flex;flex-direction:column;gap:4px;margin-top:4px"></div>
        <button class="btn btn-gh btn-sm" style="margin-top:6px" onclick="addGroupProblem()">+ 문항 추가</button>
      </div>

      <div style="display:flex;gap:7px;margin-top:8px">
        <button class="btn btn-pu btn-sm" onclick="saveGroup()">저장</button>
        <button class="btn btn-gh btn-sm" onclick="clearGF()">초기화</button>
      </div>
    </div>

    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h2 style="font-size:15px;font-weight:600">그룹 목록</h2>
        <button class="btn btn-gh btn-sm" onclick="loadGroupsPage()">새로고침</button>
      </div>
      <div class="tw" id="grp-tbl"><div class="em">불러오는 중...</div></div>
    </div>
  </div>
</div>

<!-- ④ 프롬프트 관리 -->
<div id="page-prompts" class="page">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">

    <!-- 왼쪽: 편집 폼 -->
    <div class="card">
      <div class="ct" id="pmt-title">공통 프롬프트 등록</div>
      <div class="fr"><label>ID *</label><input id="pm-id" placeholder="default"></div>
      <div class="fr"><label>이름 *</label><input id="pm-name" placeholder="기본 논술 첨삭 프롬프트"></div>
      <div class="fr"><label>설명</label><input id="pm-desc" placeholder="간단한 설명"></div>
      <div class="fr">
        <label>내용 *
          <span style="font-size:11px;color:var(--mt);margin-left:6px" id="pm-charcount"></span>
        </label>
        <textarea id="pm-content" rows="24"
          style="font-size:12px;line-height:1.7;font-family:monospace"
          oninput="document.getElementById('pm-charcount').textContent=this.value.length+'자'"></textarea>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer">
          <input type="checkbox" id="pm-default"> 기본값으로 설정
        </label>
      </div>
      <div style="display:flex;gap:7px;margin-top:10px">
        <button class="btn btn-pu btn-sm" onclick="saveSystemPrompt()">저장</button>
        <button class="btn btn-gh btn-sm" onclick="clearPMF()">초기화</button>
      </div>
    </div>

    <!-- 오른쪽: 프롬프트 목록 -->
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h2 style="font-size:15px;font-weight:600">저장된 프롬프트</h2>
        <button class="btn btn-gh btn-sm" onclick="loadSystemPrompts()">새로고침</button>
      </div>
      <div id="pm-list"></div>
    </div>
  </div>
</div>

<!-- ⑥ 설정 -->
<div id="page-settings" class="page">
  <div style="max-width:560px">
    <div class="card">
      <div class="ct">LLM 모델 선택</div>

      <!-- Gemini -->
      <label style="display:flex;align-items:flex-start;gap:12px;padding:16px;border:2px solid var(--bd);border-radius:8px;cursor:pointer;margin-bottom:10px" id="lbl-gemini">
        <input type="radio" name="llm" value="gemini" id="rb-gemini" style="margin-top:3px;accent-color:var(--pu)">
        <div>

<script>
const API='';
var uploadedFiles=[];
var itemGroupCount=0;
var currentReport=null;
var currentItemIdx=0;

// ── 문제 분류 선택 ───────────────────────────────────────────────
var allProblems=[];
var currentProbType='reg';

function setProbType(type, btn){
  currentProbType=type;
  document.querySelectorAll('.prob-type-btn').forEach(function(b){
    b.style.background='var(--s2)';b.style.color='var(--mt)';b.style.borderColor='var(--bd)';
  });
  btn.style.background='var(--pl)';btn.style.color='var(--pd)';btn.style.borderColor='var(--pu)';
  document.getElementById('sel-reg').style.display=type==='reg'?'block':'none';
  document.getElementById('sel-univ').style.display=type==='univ'?'block':'none';
  document.getElementById('prob-sel').value='';
}

// ── 그룹 선택 UI ─────────────────────────────────────────────
var allGroups=[];

async function initGroupSelectors(){
  var list=await fetch(API+'/eval/api/groups').then(function(r){return r.json();});
  allGroups=list;
  var regGroups=list.filter(function(g){return g.category==='reg';});
  var univGroups=list.filter(function(g){return g.category==='univ';});

  // 정규반 — 권 목록
  var volSet={};
  regGroups.forEach(function(g){if(g.vol)volSet[g.vol]=true;});
  var volSel=document.getElementById('reg-vol');
  if(volSel){
    var first=volSel.options[0].outerHTML;
    var opts=Object.keys(volSet).map(Number).sort(function(a,b){return a-b;}).map(function(v){
      return '<option value="'+v+'">'+v+'권</option>';
    }).join('');
    volSel.innerHTML=first+opts;
  }

  // 대학별 — 대학 목록
  var univSet={};
  univGroups.forEach(function(g){if(g.university)univSet[g.university]=true;});
  var univSel=document.getElementById('univ-school');
  if(univSel){
    var first2=univSel.options[0].outerHTML;
    var opts2=Object.keys(univSet).sort().map(function(u){
      return '<option value="'+u+'">'+u+'</option>';
    }).join('');
    univSel.innerHTML=first2+opts2;
  }
}

function updateRegSel(){
  var vol=document.getElementById('reg-vol').value;
  var lecSel=document.getElementById('reg-lec');
  var numSel=document.getElementById('reg-num');
  if(!vol){
    lecSel.innerHTML='<option value="">강 선택</option>';lecSel.disabled=true;
    numSel.innerHTML='<option value="">그룹 선택</option>';numSel.disabled=true;
    return;
  }
  var lecSet={};
  allGroups.filter(function(g){return g.category==='reg'&&g.vol==vol;}).forEach(function(g){
    if(g.lecture)lecSet[g.lecture]=true;
  });
  lecSel.innerHTML='<option value="">강 선택</option>'+Object.keys(lecSet).map(Number).sort(function(a,b){return a-b;}).map(function(l){
    return '<option value="'+l+'">'+l+'강</option>';
  }).join('');
  lecSel.disabled=false;
  numSel.innerHTML='<option value="">그룹 선택</option>';numSel.disabled=true;
  document.getElementById('prob-sel').value='';
  lecSel.onchange=function(){
    var lec=lecSel.value;
    if(!lec){numSel.innerHTML='<option value="">그룹 선택</option>';numSel.disabled=true;return;}
    var matched=allGroups.filter(function(g){return g.category==='reg'&&g.vol==vol&&g.lecture==lec;});
    numSel.innerHTML='<option value="">그룹 선택</option>'+matched.map(function(g){
      return '<option value="'+g.group_id+'">'+g.title+'</option>';
    }).join('');
    numSel.disabled=false;
    numSel.onchange=function(){selectGroup(numSel.value);};
  };
}

function updateUnivSel(){
  var school=document.getElementById('univ-school').value;
  var yearSel=document.getElementById('univ-year');
  var typeSel=document.getElementById('univ-type');
  var numSel=document.getElementById('univ-num');
  if(!school){yearSel.disabled=true;typeSel.disabled=true;numSel.disabled=true;return;}
  var yearSet={};
  allGroups.filter(function(g){return g.category==='univ'&&g.university===school;}).forEach(function(g){
    if(g.year)yearSet[g.year]=true;
  });
  yearSel.innerHTML='<option value="">연도 선택</option>'+Object.keys(yearSet).sort().reverse().map(function(y){
    return '<option value="'+y+'">'+y+'학년도</option>';
  }).join('');
  yearSel.disabled=false;
  typeSel.disabled=true;numSel.disabled=true;
  yearSel.onchange=function(){updateUnivSel2();};
}
function updateUnivSel2(){
  var school=document.getElementById('univ-school').value;
  var year=document.getElementById('univ-year').value;
  var typeSel=document.getElementById('univ-type');
  var numSel=document.getElementById('univ-num');
  if(!year){typeSel.disabled=true;numSel.disabled=true;return;}
  var typeSet={};
  allGroups.filter(function(g){return g.category==='univ'&&g.university===school&&g.year===year;}).forEach(function(g){
    if(g.exam_type)typeSet[g.exam_type]=true;
  });
  typeSel.innerHTML='<option value="">구분 선택</option>'+Object.keys(typeSet).map(function(t){
    return '<option value="'+t+'">'+t+'</option>';

  typeSel.disabled=false;
  numSel.disabled=true;
  typeSel.onchange=function(){updateUnivSel3();};
}
function updateUnivSel3(){
  var school=document.getElementById('univ-school').value;
  var year=document.getElementById('univ-year').value;
  var type=document.getElementById('univ-type').value;
  var numSel=document.getElementById('univ-num');
  var matched=allGroups.filter(function(g){
    return g.category==='univ'&&g.university===school&&g.year===year&&(!type||g.exam_type===type);
  });
  numSel.innerHTML='<option value="">그룹 선택</option>'+matched.map(function(g){
    return '<option value="'+g.group_id+'">'+g.title+'</option>';
  }).join('');
  numSel.disabled=false;
  numSel.onchange=function(){selectGroup(numSel.value);};
}

async function selectGroup(gid){
  document.getElementById('prob-sel').value=gid||'';
  var previewId=currentProbType==='reg'?'reg-preview':'univ-preview';
  var preview=document.getElementById(previewId);
  if(!gid){if(preview)preview.style.display='none';return;}
  var g=await fetch(API+'/eval/api/groups/'+gid).then(function(r){return r.json();});
  if(preview){
    preview.style.display='block';
    var plist=(g.problems||[]).map(function(p,i){return '<span style="font-size:11px;background:var(--s);border:1px solid var(--bd);border-radius:4px;padding:1px 7px;margin-right:4px">문항'+(i+1)+' '+p.title+'</span>';}).join('');
    preview.innerHTML='<div style="background:var(--pl);border-radius:6px;padding:8px 12px;font-size:12px;color:var(--pd);margin-top:4px">'
      +'<strong>'+g.title+'</strong> ('+g.problem_ids.length+'문항)'
      +(plist?'<div style="margin-top:5px">'+plist+'</div>':'')
      +'</div>';
  }
}

async function initProblemSelectors(){
  var list=await fetch(API+'/eval/api/problems').then(function(r){return r.json();});
  allProblems=list;
  // 대학별 — 대학 목록 추출
  var univSet={};
  list.forEach(function(p){
    if(p.problem_id.startsWith('univ_')&&p.university){
      univSet[p.university]=true;
    }
  });
  var univSel=document.getElementById('univ-school');
  if(univSel){
    var first=univSel.options[0].outerHTML;
    var opts=Object.keys(univSet).sort().map(function(u){
      return '<option value="'+u+'">'+u+'</option>';
    }).join('');
    univSel.innerHTML=first+opts;
  }
  // prob-sel (hidden) — 기존 호환용
  updateRegSel();
}

function updateRegSel(){
  var vol=document.getElementById('reg-vol').value;
  var lecSel=document.getElementById('reg-lec');
  var numSel=document.getElementById('reg-num');
  // 강 목록 — vol 선택 시 해당 권의 강 목록 추출
  if(!vol){
    lecSel.innerHTML='<option value="">강 선택</option>';
    lecSel.disabled=true;
    numSel.innerHTML='<option value="">번호 선택</option>';
    numSel.disabled=true;
    return;
  }
  var lecSet={};
  allProblems.forEach(function(p){
    if(p.problem_id.startsWith('reg_'+vol+'_')){
      var parts=p.problem_id.split('_');
      if(parts.length>=3)lecSet[parts[2]]=true;
    }
  });
  var lecs=Object.keys(lecSet).map(Number).sort(function(a,b){return a-b;});
  lecSel.innerHTML='<option value="">강 선택</option>'+lecs.map(function(l){
    return '<option value="'+l+'">'+l+'강</option>';
  }).join('');
  lecSel.disabled=false;
  numSel.innerHTML='<option value="">번호 선택</option>';
  numSel.disabled=true;
  document.getElementById('prob-sel').value='';
  document.getElementById('reg-preview').style.display='none';
  // 강 변경 감지
  lecSel.onchange=function(){
    var lec=lecSel.value;
    if(!lec){numSel.innerHTML='<option value="">번호 선택</option>';numSel.disabled=true;return;}
    var numSet={};
    allProblems.forEach(function(p){
      var pid=p.problem_id;
      var prefix='reg_'+vol+'_'+String(lec).padStart(2,'0')+'_';
      var prefix2='reg_'+vol+'_'+lec+'_';
      if(pid.startsWith(prefix)||pid.startsWith(prefix2)){
        var parts=pid.split('_');
        if(parts.length>=4)numSet[parts[3]]=pid;
      }
    });
    var nums=Object.keys(numSet).map(Number).sort(function(a,b){return a-b;});
    numSel.innerHTML='<option value="">번호 선택</option>'+nums.map(function(n){
      return '<option value="'+numSet[n]+'">'+n+'번</option>';
    }).join('');
    numSel.disabled=false;
    numSel.onchange=function(){selectProblem(numSel.value);};
  };
}

function updateUnivSel(){
  var school=document.getElementById('univ-school').value;
  var yearSel=document.getElementById('univ-year');
  var typeSel=document.getElementById('univ-type');
  var numSel=document.getElementById('univ-num');
  if(!school){
    yearSel.disabled=true;typeSel.disabled=true;numSel.disabled=true;
    return;
  }
  var yearSet={};
  allProblems.forEach(function(p){
    if(p.university===school&&p.year)yearSet[p.year]=true;
  });
  var years=Object.keys(yearSet).sort().reverse();
  yearSel.innerHTML='<option value="">연도 선택</option>'+years.map(function(y){
    return '<option value="'+y+'">'+y+'학년도</option>';
  }).join('');
  yearSel.disabled=false;
  typeSel.disabled=true;numSel.disabled=true;
  document.getElementById('prob-sel').value='';
}

function updateUnivSel2(){
  var school=document.getElementById('univ-school').value;
  var year=document.getElementById('univ-year').value;
  var typeSel=document.getElementById('univ-type');
  var numSel=document.getElementById('univ-num');
  if(!year){typeSel.disabled=true;numSel.disabled=true;return;}
  // 해당 대학/연도의 구분(기출/모의) 확인
  var typeSet={};
  allProblems.forEach(function(p){
    if(p.university===school&&p.year===year&&p.subject){

    typeSel.innerHTML='<option value="">구분 선택</option>'+Object.keys(typeSet).map(function(t){
      return '<option value="'+t+'">'+t+'</option>';
    }).join('');
    typeSel.disabled=false;
    typeSel.onchange=updateUnivSel3;
  } else {
    // 구분 없이 바로 번호로
    typeSel.innerHTML='<option value="">구분 없음</option>';
    typeSel.disabled=true;
    updateUnivSel3();
  }
  numSel.disabled=true;
}

function updateUnivSel3(){
  var school=document.getElementById('univ-school').value;
  var year=document.getElementById('univ-year').value;
  var type=document.getElementById('univ-type').value;
  var numSel=document.getElementById('univ-num');
  var matched=allProblems.filter(function(p){
    return p.university===school&&p.year===year&&
      (type===''||p.subject===type||p.subject==='');

  if(!matched.length){numSel.innerHTML='<option value="">번호 없음</option>';numSel.disabled=true;return;}
  numSel.innerHTML='<option value="">번호 선택</option>'+matched.map(function(p,i){
    return '<option value="'+p.problem_id+'">'+(i+1)+'번 ('+p.title+')</option>';
  }).join('');
  numSel.disabled=false;
  numSel.onchange=function(){selectProblem(numSel.value);};
}

async function selectProblem(pid){
  document.getElementById('prob-sel').value=pid||'';
  var previewId=currentProbType==='reg'?'reg-preview':'univ-preview';
  var preview=document.getElementById(previewId);
  if(!pid){if(preview)preview.style.display='none';return;}
  var p=await fetch(API+'/eval/api/problems/'+pid).then(function(r){return r.json();});

    preview.innerHTML='<div style="background:var(--pl);border-radius:6px;padding:8px 12px;font-size:12px;color:var(--pd);margin-top:4px">'

      +(p.question?'<br><span style="opacity:.8">'+p.question.slice(0,80)+(p.question.length>80?'...':'')+'</span>':'')

// ── 파일 업로드 & 자동 헤더 분석 ────────────────────────────────
var autoMappedGroups = [];  // 자동 분석 결과

async function handleFiles(files){
  uploadedFiles = Array.from(files);
  if(!uploadedFiles.length) return;

  var aa = document.getElementById('auto-analysis');
  aa.style.display = 'block';
  aa.innerHTML = '<div class="sb"><div class="sp"></div><span>원고지 분석 중... PDF는 페이지별로 분리합니다.</span></div>';
  document.getElementById('manual-area').style.display = 'none';
  document.getElementById('submit-btn').style.display = 'none';

  var fd = new FormData();
  uploadedFiles.forEach(function(f){ fd.append('files', f); });

  try {
    var res = await fetch(API + '/eval/api/batch-analyze', {method:'POST', body:fd});
    var data = await res.json();
    renderBatchAnalysis(data);
  } catch(e) {
    aa.innerHTML = '<div style="color:var(--re);font-size:13px;padding:8px">분석 실패: '+e.message+'</div>';
    showManualMode();
  }
}

var batchAnalysisData = null;

// 배치 분석 결과 편집 함수
function updateStudentName(si, newName){
  newName = newName.trim();
  var students = Object.keys(batchAnalysisData.grouped);
  var oldName = students[si];
  if(oldName === newName) return;

  // 동일 이름 학생이 이미 있으면 문항 합치기
  if(batchAnalysisData.grouped[newName]){
    var existing = batchAnalysisData.grouped[newName];
    var merging  = batchAnalysisData.grouped[oldName];
    // 문항 병합 — 번호 충돌 시 기존 유지
    Object.keys(merging.items).forEach(function(k){
      if(!existing.items[k]){
        existing.items[k] = merging.items[k];
      } else {
        // 번호 충돌 → 빈 번호 찾아서 배정
        var maxNum = Math.max.apply(null, Object.keys(existing.items).filter(function(n){return n!=='unassigned';}).map(Number));
        existing.items[maxNum+1] = merging.items[k];
      }
    });
    // group_id 통일
    if(!existing.group_id && merging.group_id) existing.group_id = merging.group_id;
    delete batchAnalysisData.grouped[oldName];
  } else {
    batchAnalysisData.grouped[newName] = batchAnalysisData.grouped[oldName];
    delete batchAnalysisData.grouped[oldName];
  }

  // UI 다시 렌더링
  renderBatchAnalysis(batchAnalysisData);
}
function updateGroupId(si, newGroupId){
  var students = Object.keys(batchAnalysisData.grouped);
  var name = students[si];
  batchAnalysisData.grouped[name].group_id = newGroupId;
}
function updateItemNum(si, oldNum, newNum){
  var students = Object.keys(batchAnalysisData.grouped);
  var name = students[si];
  var items = batchAnalysisData.grouped[name].items;
  if(oldNum !== parseInt(newNum)){
    items[parseInt(newNum)] = items[oldNum];
    delete items[oldNum];
  }
}
function updateProblemId(si, itemNum, newPid){
  var students = Object.keys(batchAnalysisData.grouped);
  var name = students[si];
  var items = batchAnalysisData.grouped[name].items;
  if(items[itemNum]) items[itemNum].problem_id = newPid;
}

async function batchSubmit(){
  document.getElementById('status-area').style.display='block';
  document.getElementById('result-area').innerHTML='';
  document.getElementById('st').textContent='일괄 제출 중...';

  try{
    var res = await fetch(API+'/eval/api/batch-submit',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(batchAnalysisData)
    });
    if(!res.ok){
      var err=await res.text();
      document.getElementById('st').textContent='오류: '+err.slice(0,100);
      return;
    }
    var data = await res.json();
    var ids = data.submission_ids || [];
    document.getElementById('st').textContent=ids.length+'명 제출 완료. OCR 처리 중...';

    // 여러 학생 폴링
    if(ids.length === 1){
      pollStatus(ids[0].submission_id);
    } else {
      pollBatchStatus(ids);
    }
  }catch(e){
    document.getElementById('st').textContent='오류: '+e.message;
  }
}

function pollBatchStatus(submissions){
  var total = submissions.length;
  var done = 0;
  var doneIds = [];
  submissions.forEach(function(s){
    var t = setInterval(async function(){
      var d = await fetch(API+'/eval/api/status/'+s.submission_id).then(function(r){return r.json();});
      if(d.status==='ocr_done'||d.status==='done'||d.status==='teacher_reviewed'){
        clearInterval(t);
        done++;
        doneIds.push(s.submission_id);
        document.getElementById('st').textContent=done+'/'+total+'명 OCR 완료';
        if(done===total){
          document.getElementById('sp').style.display='none';
          document.getElementById('st').textContent='전체 OCR 완료!';
          // 전체 일괄 첨삭 버튼 표시
          showBatchAnnotateButton(doneIds, total);
        }
      }
    }, 3000);
  });
}

async function startBatchAnnotate(submissionIds){
  document.getElementById('status-area').innerHTML = '<div class="sb"><div class="sp"></div><span>전체 첨삭 진행 중...</span></div>';
  var completed = 0;
  var total = submissionIds.length;

  for(var i=0; i<submissionIds.length; i++){
    var sid = submissionIds[i];
    // 해당 제출의 문항 목록 가져오기
    var report = await fetch(API+'/eval/api/report/'+sid).then(function(r){return r.json();});
    var items = report.items || [];

    for(var j=0; j<items.length; j++){
      var item = items[j];
      if(item.status === 'ocr_done' || item.status === 'ocr_reviewed'){
        await fetch(API+'/eval/api/item/'+item.item_id+'/annotate',{
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            ocr_text: item.ocr_text,
            problem_id: item.problem_id || null,
            item_number: item.item_number
          })
        });
      }
    }
    completed++;
    document.getElementById('status-area').innerHTML = '<div class="sb"><div class="sp"></div><span>첨삭 중... '+completed+'/'+total+'명 완료</span></div>';
  }

  document.getElementById('status-area').innerHTML = '<div style="background:var(--gl);border:1px solid var(--gn);border-radius:8px;padding:12px 16px;font-size:13px;font-weight:600;color:var(--gn)">전체 첨삭 완료! 평가 목록에서 확인하세요.</div>';
  setTimeout(function(){
    goToReports();
  }, 2000);
}

function showManualMode(){
  document.getElementById('manual-area').style.display = 'block';
  document.getElementById('submit-btn').style.display = 'block';
  // 썸네일 생성
  var grid = document.getElementById('thumb-grid');
  grid.innerHTML = '';
  uploadedFiles.forEach(function(f, i){
    var div = document.createElement('div');
    div.className = 'img-thumb';
    div.draggable = true;
    div.dataset.idx = i;
    div.innerHTML = '<div class="img-label">'+f.name.slice(0,10)+'</div>';
    if(f.type.startsWith('image/')){
      var img = document.createElement('img');
      var reader = new FileReader();
      reader.onload = function(e2){ img.src = e2.target.result; };
      reader.readAsDataURL(f);
      div.insertBefore(img, div.firstChild);
    }
    div.addEventListener('dragstart', function(e){
      e.dataTransfer.setData('fileIdx', i);
      div.classList.add('dragging');
    });
    div.addEventListener('dragend', function(){ div.classList.remove('dragging'); });
    grid.appendChild(div);
  });
  if(document.getElementById('item-groups').children.length === 0){
    addItemGroup();
  }
}

async function submitEssay(){
  if(!uploadedFiles.length){alert('이미지를 업로드해주세요.');return;}

  // 배치 분석 결과가 있으면 일괄 제출
  if(batchAnalysisData && Object.keys(batchAnalysisData.grouped||{}).length > 0){
    await batchSubmit();
    return;
  }

  // 수동 모드 — 기존 단일 제출 흐름
  var sid=document.getElementById('sid').value.trim();
  if(!sid){alert('학생 ID를 입력해주세요.');return;}

  // 그룹 데이터 수집 — 자동 매핑 우선, 없으면 수동
  var groups=[];
  if(autoMappedGroups.length>0){
    groups=autoMappedGroups;
  } else {
    var groupEls=document.getElementById('item-groups').children;
    for(var i=0;i<groupEls.length;i++){
      var el=groupEls[i];
      var n=parseInt(el.id.replace('group-',''));
      var zone=document.getElementById('drop-'+n);
      var chips=zone?zone.querySelectorAll('[data-file-idx]'):[];
      var keys=[];
      chips.forEach(function(c){keys.push(parseInt(c.dataset.fileIdx));});
      if(keys.length>0){
        var ptype=document.getElementById('ptype-'+n);
        groups.push({item_number:n,image_keys:keys,problem_type:ptype?ptype.value:''});
      }
    }
  }
  if(!groups.length){alert('문항에 이미지를 지정해주세요.');return;}

  var snm=document.getElementById('snm').value.trim();
  var acad=document.getElementById('acad').value.trim();
  var pid=document.getElementById('prob-sel').value||(autoMappedGroups.length>0?autoMappedGroups[0].group_id:'');

  var fd=new FormData();
  fd.append('student_id',sid);
  fd.append('student_name',snm);
  fd.append('academy_name',acad);
  if(pid)fd.append('group_id',pid);
  fd.append('item_groups_json',JSON.stringify(groups));
  uploadedFiles.forEach(function(f){fd.append('files',f);});

  document.getElementById('status-area').style.display='block';
  document.getElementById('result-area').innerHTML='';
  document.getElementById('st').textContent='제출 중...';

  try{
    var res=await fetch(API+'/eval/api/submit',{method:'POST',body:fd});
    if(!res.ok){
      var err=await res.text();
      document.getElementById('st').textContent='서버 오류 '+res.status+': '+err.slice(0,100);
      return;
    }
    var d=await res.json();
    if(!d.submission_id){
      document.getElementById('st').textContent='오류: submission_id 없음 - '+JSON.stringify(d);
      return;
    }
    pollStatus(d.submission_id);
  }catch(e){
    document.getElementById('st').textContent='오류: '+e.message;
  }
}

function pollStatus(id){
  var stages=['OCR 처리 중...','첨삭 생성 중...','문항별 분석 중...','리포트 생성 중...'];
  var si=0;
  var t=setInterval(async function(){
    si=(si+1)%stages.length;
    document.getElementById('st').textContent=stages[si];
    var d=await fetch(API+'/eval/api/status/'+id).then(function(r){return r.json();});
    if(d.status==='ocr_done'){
      clearInterval(t);
      document.getElementById('sp').style.display='none';
      document.getElementById('st').textContent='OCR 완료 - 검토 후 첨삭 시작하세요';
      loadOcrReview(id);
    }else if(d.status==='done'||d.status==='teacher_reviewed'){
      clearInterval(t);
      document.getElementById('sp').style.display='none';
      document.getElementById('st').textContent='첨삭 완료!';
      loadReportResult(id);
    }else if(d.status&&d.status.startsWith('error')){
      clearInterval(t);
      document.getElementById('st').textContent='오류: '+d.status;
    }
  },2500);
}

// ── OCR 검토 UI ──────────────────────────────────────────────
async function loadOcrReview(id){
  var r=await fetch(API+'/eval/api/report/'+id).then(function(x){return x.json();});
  currentReport=r;
  var area=document.getElementById('result-area');
  var items=r.items||[];
  if(!items.length){area.innerHTML='<div class="em">문항 없음</div>';return;}

  var html='<div class="report-wrap">';
  html+='<div style="background:#EAF3DE;border:1px solid #639922;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#27500A">';
  html+='OCR 결과를 확인하고 오타·오기를 수정한 후 문항별로 첨삭을 시작하세요.</div>';

  // 문항 탭
  html+='<div class="item-tab-bar" id="ocr-tab-bar">';
  items.forEach(function(item,i){
    html+='<button class="item-tab'+(i===0?' active':'')+'" id="ocr-tab-'+i+'" onclick="switchOcrItem('+i+',this)">문항 '+item.item_number+'</button>';
  });
  html+='</div>';
  html+='<div id="ocr-item-content"></div>';
  html+='</div>';

  area.innerHTML=html;
  currentItemIdx=0;
  renderOcrItem(items[0], 0);
}

function switchOcrItem(idx, btn){
  document.querySelectorAll('.item-tab').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  currentItemIdx=idx;
  renderOcrItem(currentReport.items[idx], idx);
}

function renderOcrItem(item, idx){
  var el=document.getElementById('ocr-item-content');
  if(!el)return;
  var isDone=item.status==='ocr_reviewed'||item.status==='evaluated'||item.status==='teacher_done';
  var statusBadge=isDone
    ?'<span style="background:var(--gl);color:var(--gn);font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600">검토 완료</span>'
    :'<span style="background:var(--al);color:var(--am);font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600">검토 필요</span>';

  var html='<div class="report-section">';
  html+='<div class="report-section-header" style="justify-content:space-between">';
  html+='<span>문항 '+item.item_number+' OCR 텍스트 '+statusBadge+'</span>';
  html+='<span style="font-size:11px;color:var(--mt)">신뢰도 '+Math.round((item.ocr_confidence||0)*100)+'%</span>';
  html+='</div>';
  html+='<div class="report-section-body">';
  html+='<textarea id="ocr-text-'+idx+'" rows="12" style="font-size:13px;line-height:1.9">'+( item.ocr_text||'').replace(/</g,'&lt;')+'</textarea>';
  html+='</div></div>';

  // 버튼
  html+='<div style="display:flex;gap:8px;margin-top:10px">';
  if(item.status==='evaluated'||item.status==='teacher_done'){
    html+='<button class="btn btn-gh btn-sm" onclick="viewAnnotation('+idx+')">첨삭 결과 보기</button>';
  } else {
    html+='<button class="btn btn-te btn-sm" onclick="startAnnotation('+idx+')">이 문항 첨삭 시작</button>';
  }
  if(idx<(currentReport.items.length-1)){
    var nextBtn='<button class="btn btn-gh btn-sm" onclick="goNextOcrItem('+(idx+1)+')">다음 문항 &rarr;</button>';html+=nextBtn;
  }
  html+='</div>';

  el.innerHTML=html;
}

async function startAnnotation(idx){
  var item=currentReport.items[idx];
  var textarea=document.getElementById('ocr-text-'+idx);
  var correctedText=textarea?textarea.value:item.ocr_text;

  // OCR 수정본 저장
  await fetch(API+'/eval/api/item/'+item.item_id+'/ocr',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({corrected_text:correctedText})
  });

  // 첨삭 트리거
  var stEl=document.getElementById('st');if(stEl)stEl.textContent='문항 '+item.item_number+' 첨삭 중...';
  var spEl=document.getElementById('sp');if(spEl)spEl.style.display='';
  var saEl=document.getElementById('sa');if(saEl)saEl.style.display='block';

  await fetch(API+'/eval/api/item/'+item.item_id+'/annotate',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      ocr_text:correctedText,
      problem_id:item.problem_id||null,
      item_number:item.item_number
    })
  });

  // 완료 대기
  var t=setInterval(async function(){
    var r=await fetch(API+'/eval/api/report/'+currentReport.submission_id).then(function(x){return x.json();});
    var updatedItem=r.items.find(function(i){return i.item_id===item.item_id;});
    if(updatedItem&&(updatedItem.status==='evaluated'||updatedItem.status==='teacher_done')){
      clearInterval(t);
      document.getElementById('sp').style.display='none';
      document.getElementById('st').textContent='문항 '+item.item_number+' 첨삭 완료!';
      currentReport=r;
      var tab=document.getElementById('ocr-tab-'+idx);
      if(tab)tab.classList.add('done');
      renderOcrItem(r.items[idx], idx);
      // 전체 완료 확인
      var allDone=r.items.every(function(i){return i.status==='evaluated'||i.status==='teacher_done';});
      if(allDone){
        document.getElementById('st').textContent='전체 첨삭 완료!';
        setTimeout(function(){renderReport(r);},800);
      } else {
        // 다음 미완료 문항 찾기 — 자동 이동 대신 버튼 표시
        var nextIdx=-1;
        for(var ni=0;ni<r.items.length;ni++){
          if(r.items[ni].status!=='evaluated'&&r.items[ni].status!=='teacher_done'){
            nextIdx=ni; break;
          }
        }
        if(nextIdx>=0){
          var stEl2=document.getElementById('st');
          if(stEl2){
            stEl2.innerHTML='문항 '+item.item_number+' 첨삭 완료! '
              +'<button class="btn btn-te btn-sm" style="margin-left:8px" '
              +'onclick="goNextOcrItem('+nextIdx+')">문항 '+(nextIdx+1)+' OCR 확인 &rarr;</button>';
          }
        }
      }

    }
  },2500);
}

function renderItem(item){
  var el=document.getElementById('item-content');
  var final=item.teacher_result&&Object.keys(item.teacher_result).length?item.teacher_result:item.llm_result;
  var isEdit=false;

  function buildView(){
    var score=item.score!=null?'<span class="score-badge">'+item.score+'점</span>':'<span style="color:var(--mt);font-size:13px">점수 미입력</span>';
    var html='';
    // 헤더
    html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">';
    html+='<div style="font-size:15px;font-weight:600">문항 '+item.item_number;
    if(item.problem_type)html+=' <span style="font-size:12px;color:var(--mt);font-weight:400">'+item.problem_type+'</span>';
    html+='</div>';
    html+='<div style="display:flex;align-items:center;gap:10px">'+score;
    html+='<button class="btn btn-gh btn-sm" onclick="toggleEdit()">수정 모드</button>';
    html+='<button class="btn btn-te btn-sm" onclick="saveItem()">저장 완료</button>';
    html+='</div></div>';
    // 원문
    html+='<div class="report-section">';
    html+='<div class="report-section-header">학생 제출 답안</div>';
    html+='<div class="report-section-body"><div class="numbered-text" id="edit-numbered">'+(final.numbered_text||item.ocr_text||'없음')+'</div></div>';
    html+='</div>';
    // 장점
    html+=annotSection('장점','edit-strengths',final.strengths||'');
    html+=annotSection('단점','edit-weaknesses',final.weaknesses||'');
    html+=annotSection('보완할 부분','edit-improvements',final.improvements||'');
    html+=annotSection('총평','edit-summary',final.summary||'');
    // 점수
    html+='<div class="report-section">';
    html+='<div class="report-section-header">점수</div>';
    html+='<div class="report-section-body" style="display:flex;align-items:center;gap:10px">';
    html+='<input type="number" id="item-score" min="0" max="100" step="0.5" value="'+(item.score||'')+'" style="width:80px;border:1px solid var(--bd);border-radius:6px;padding:6px 10px;font-size:14px">';
    html+='<span style="font-size:13px;color:var(--mt)">/ 100점</span>';
    html+='</div></div>';
    return html;
  }

  el.innerHTML=buildView();

  window.toggleEdit=function(){
    isEdit=!isEdit;
    var fields=['numbered','strengths','weaknesses','improvements','summary'];
    fields.forEach(function(f){
      var el2=document.getElementById('edit-'+f);
      if(!el2)return;
      var cur=el2.textContent||el2.value||'';
      if(isEdit){
        var ta=document.createElement('textarea');
        ta.id='edit-'+f;
        ta.rows=f==='improvements'?10:5;
        ta.value=cur;
        ta.style.width='100%';
        el2.replaceWith(ta);
      }else{
        var div2=document.createElement(f==='numbered'?'div':'div');
        div2.id='edit-'+f;
        div2.className=f==='numbered'?'numbered-text':'annotation-text';
        div2.textContent=el2.value;
        el2.replaceWith(div2);
      }
    });
  };

  window.saveItem=async function(){
    var getVal=function(id){
      var e=document.getElementById(id);
      return e?e.value||e.textContent:'';
    };
    var teacherResult={
      numbered_text:getVal('edit-numbered'),
      strengths:getVal('edit-strengths'),
      weaknesses:getVal('edit-weaknesses'),
      improvements:getVal('edit-improvements'),
      summary:getVal('edit-summary'),
    };
    var scoreEl=document.getElementById('item-score');
    var score=scoreEl&&scoreEl.value?parseFloat(scoreEl.value):null;
    await fetch(API+'/eval/api/item/'+item.item_id+'/review',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({score:score},teacherResult))
    });
    alert('문항 '+item.item_number+' 저장 완료!');
    // 탭 done 표시
    var tabs=document.querySelectorAll('.item-tab');
    if(tabs[currentItemIdx])tabs[currentItemIdx].classList.add('done');
    // 데이터 갱신
    item.teacher_result=teacherResult;
    item.score=score;
    item.status='teacher_done';
  };
}

function escapeHtml(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function nl2br(t){
  return escapeHtml(t).replace(/\n/g,'<br>');
}
function annotSection(label,id,val){
  // 보완할 부분은 줄나눔 강조 스타일 적용
  var isImprove=(id==='edit-improvements');
  var cls=isImprove?'improvement-section':'annotation-text';
  var body;
  if(isImprove){
    body=formatImprovementsHtml(val);
  }else if(id==='edit-numbered'){
    body=escapeHtml(val).replace(/\n\n/g,'<br><br>').replace(/\n/g,' ');
  }else{
    body=nl2br(val);
  }
  return '<div class="report-section">'
    +'<div class="report-section-header">'+label+'</div>'
    +'<div class="report-section-body"><div class="'+cls+'" id="'+id+'">'+body+'</div></div>'
    +'</div>';
}
function formatImprovementsHtml(text){
  if(!text)return '';
  // (N) 으로 시작하는 항목 분리 — lookahead 대신 직접 분리
  var items=[];
  var parts=text.split('\n\n');
  var cur='';
  parts.forEach(function(p){
    p=p.trim();
    if(!p)return;
    if(/^\(\d+\)/.test(p)){
      if(cur.trim())items.push(cur.trim());
      cur=p;
    } else {
      cur+=cur?'\n'+p:p;
    }
  });
  if(cur.trim())items.push(cur.trim());
  // 항목이 없으면 단순 줄바꿈 처리
  if(!items.length)return nl2br(text);
  var html='';
  items.forEach(function(item){
    item=item.trim();
    if(!item)return;
    // 첫 줄(헤더)과 나머지 분리
    var lines=item.split('\n');
    var header=lines[0];
    var body=lines.slice(1).join('\n');
    // 수정 전/후/이유 스타일
    body=body
      .replace(/수정 전: /g,'<span style="color:var(--am);font-weight:600">수정 전</span> ')
      .replace(/수정 후: /g,'<span style="color:var(--te);font-weight:600">수정 후</span> ')
      .replace(/→ 수정 이유: /g,'<span style="color:var(--mt);font-size:12px">→ 수정 이유</span> ')
      .replace(/\n/g,'<br>');
    html+='<div style="background:var(--s2);border-radius:7px;padding:12px 14px;margin-bottom:10px;font-size:13px;line-height:1.9">';
    html+='<div style="font-weight:600;margin-bottom:8px;color:var(--pu)">'+header+'</div>';
    if(body)html+='<div>'+body+'</div>';
    html+='</div>';
  });
  return html;
}

}

async function saveSettings(){

  div.style.cssText='display:flex;align-items:center;gap:6px';

    answerText=answerText.replace(/\n\n/g,'<br><br>').replace(/\n/g,' ');
    html+='<div class="answer-box">'+answerText+'</div>';

    // 세부 첨삭
    html+='<div class="section-title" style="font-size:13px">세부 첨삭</div>';
    if(final.strengths){
      html+='<div class="feedback-section"><div class="tag">장점</div>';
      html+='<div class="feedback-text">'+final.strengths+'</div></div>';
    }
    if(final.weaknesses){
      html+='<div class="feedback-section"><div class="tag">단점</div>';
      html+='<div class="feedback-text">'+final.weaknesses+'</div></div>';
    }
    if(final.improvements){
      html+='<div class="feedback-section"><div class="tag">보완할 부분</div>';
      var impParts=final.improvements.split('\n\n');
      var impCur='';var impItems=[];
      impParts.forEach(function(p){p=p.trim();if(!p)return;
        if(/^\(\d+\)/.test(p)){if(impCur.trim())impItems.push(impCur.trim());impCur=p;}
        else{impCur+=impCur?'\n'+p:p;}
      });
      if(impCur.trim())impItems.push(impCur.trim());
      if(!impItems.length)impItems=[final.improvements];
      impItems.forEach(function(item){
        item=item.trim();if(!item)return;
        var ilines=item.split('\n');var hdr=ilines[0];var bdy=ilines.slice(1).join('\n');
        bdy=bdy.replace(/수정 전: /g,'<strong style="color:#854F0B">수정 전</strong> ');
        bdy=bdy.replace(/수정 후: /g,'<strong style="color:#0F6E56">수정 후</strong> ');
        bdy=bdy.replace(/→ 수정 이유: /g,'<span style="color:#6b6b66;font-size:12px">→ 수정 이유</span> ');
        bdy=bdy.replace(/\n/g,'<br>');
        html+='<div class="improvement-item"><div style="font-weight:700;color:#534AB7;margin-bottom:6px">'+hdr+'</div>'+(bdy?'<div>'+bdy+'</div>':'')+'</div>';
      });
      html+='</div>';
    }
    if(final.summary){
      html+='<div class="feedback-section"><div class="tag">총평</div>';
      html+='<div class="feedback-text">'+final.summary+'</div></div>';
    }
    html+='<div class="footer">'+academyName+'</div>';
  });

  html+='</div></body></html>';

  // 새 창에서 열기
  var win=window.open('','_blank');
  win.document.write(html);
  win.document.close();
}

async function deleteSubmission(id){
  if(!confirm('이 평가 결과를 삭제하시겠습니까?'))return;
  await fetch(API+'/eval/api/reports/'+id,{method:'DELETE'});
  loadReports();
}
async function deleteStudent(sid){
  if(!confirm('학생 ['+sid+'] 및 모든 평가 이력을 삭제하시겠습니까?'))return;
  await fetch(API+'/eval/api/students/'+sid,{method:'DELETE'});
  loadStudents();
}

// 초기 로드
loadProblems();
loadSystemPrompts();
initGroupSelectors();

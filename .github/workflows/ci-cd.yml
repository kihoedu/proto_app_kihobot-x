name: Kihobot-X CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1단계: 코드 품질 및 의존성 검사
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python & Node.js
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Install Node.js Dependencies
        run: npm install

      - name: Lint with flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # 테스트 코드가 존재할 경우 실행
      - name: Run Tests
        run: pytest || echo "No tests found"

  # 2단계: Docker 빌드 테스트 (멀티 컨테이너 구조 확인)
  docker-build-test:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Dummy .env
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "CLOUDFLARE_TUNNEL_TOKEN=test_token" >> .env

      - name: Build with Docker Compose
        run: docker compose build

  # 3단계: 배포 (선택 사항 - Self-hosted Runner 또는 특정 서버 전송)
  # 이 단계는 실제 운영 서버가 있을 경우 활성화합니다.